<!doctype html>
<!--
  ============================================================================
  ICON STUDIO — custom app icons for iOS, Android, macOS, Windows & the web
  One self-contained file: open it in a browser or upload it to any static host.

  HOW TO ADD A NEW APP
    Find CATALOG_RAW in the <script> below and add one row:
      ['myapp', 'social', 'si:myapp', 'My App', 'ia', 'aliases in czech and english']
    - glyph: "si:<slug>"  → Simple Icons brand (slugs: https://simpleicons.org)
             "lu:<name>"  → Lucide generic icon (names: https://lucide.dev/icons)
             "tx:Ab"      → 1–4 letters or an emoji
    - platforms: i=iOS a=Android m=macOS w=Windows, "*" = everywhere
    - optional 7th item: per-platform name/glyph, e.g. {a:{n:'Gallery', g:'lu:image'}}

  HOW TO ADD A NEW PLATFORM
    1. Add an entry to PLATFORMS (sizes, default export shape, shapes, mockup kind).
    2. Teach shapeFor() the platform's native mask and Mock.layout() its home screen.
    3. Add a guide in GUIDES and button labels in I18N (cs + en).

  Sections in the script: UTIL · I18N · CATALOG · PLATFORMS · STATE · STORAGE ·
  GLYPHS · RENDER · SVG · THUMBS · CATALOG UI · TRAY · EDITOR · COLOR PICKER ·
  PICKERS · PREVIEW · EXPORT · GUIDES · MAIN
  ============================================================================
-->

<head>

<title>Icon Studio</title>

<script defer src="https://cdn.jsdelivr.net/npm/lucide@1.50.0/dist/umd/lucide.min.js"></script>

<style>
/* ==========================================================================
   STYLES — neutral studio UI. The icons bring the colour, the app stays grey.
   ========================================================================== */
:root{
  --desk:#f5f5f4; --card:#ffffff; --card-2:#fafaf9; --well:#f0efed;
  --hairline:#e7e5e4; --hairline-2:#d6d3d1;
  --ink:#1c1917; --ink-2:#57534e; --ink-3:#8a8580; --ink-inv:#ffffff;
  --press:#1c1917; --press-ink:#ffffff;
  --focus:#2563eb; --warn:#b45309; --warn-bg:#fef3c7; --danger:#b91c1c; --ok:#15803d;
  --shadow:0 1px 2px rgba(28,25,23,.05),0 6px 20px rgba(28,25,23,.05);
  --shadow-lg:0 10px 40px rgba(28,25,23,.18);
  --r-card:18px; --r-ctl:12px; --r-pill:999px;
  --top-h:60px; --tab-h:64px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#111113; --card:#1a1a1d; --card-2:#202024; --well:#26262b;
    --hairline:#2d2d33; --hairline-2:#3b3b42;
    --ink:#f4f4f5; --ink-2:#b4b4bb; --ink-3:#85858e; --ink-inv:#111113;
    --press:#f4f4f5; --press-ink:#111113;
    --focus:#60a5fa; --warn:#fbbf24; --warn-bg:#3a2d0b; --danger:#f87171; --ok:#4ade80;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
    --shadow-lg:0 10px 40px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#111113; --card:#1a1a1d; --card-2:#202024; --well:#26262b;
  --hairline:#2d2d33; --hairline-2:#3b3b42;
  --ink:#f4f4f5; --ink-2:#b4b4bb; --ink-3:#85858e; --ink-inv:#111113;
  --press:#f4f4f5; --press-ink:#111113;
  --focus:#60a5fa; --warn:#fbbf24; --warn-bg:#3a2d0b; --danger:#f87171; --ok:#4ade80;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
  --shadow-lg:0 10px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default;opacity:.45}
img,canvas,svg{display:block}
[hidden]{display:none!important}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--press);color:var(--press-ink);padding:10px 14px;border-radius:10px;text-decoration:none}
.skip:focus{top:10px}
.lc{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lc.sm{width:15px;height:15px}
.lc.lg{width:22px;height:22px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;height:var(--top-h);display:flex;align-items:center;gap:14px;padding:0 16px;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--desk) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--hairline)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:16px;white-space:nowrap}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--press);color:var(--press-ink);display:grid;place-items:center}
.brand-mark svg{width:16px;height:16px}
.platforms{display:flex;gap:2px;padding:3px;background:var(--well);border-radius:var(--r-pill);margin:0 auto;overflow-x:auto;scrollbar-width:none;max-width:100%}
.platforms::-webkit-scrollbar{display:none}
.platforms button{height:32px;padding:0 14px;border-radius:var(--r-pill);font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;display:flex;align-items:center;gap:6px;transition:background .18s,color .18s}
.platforms button[aria-checked="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.top-actions{display:flex;gap:6px;align-items:center}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);transition:background .15s,color .15s}
.ibtn:hover{background:var(--well);color:var(--ink)}
.ibtn.txt{width:auto;padding:0 10px;font-weight:700;font-size:13px}
.menu{position:absolute;right:12px;top:calc(var(--top-h) - 4px);min-width:230px;background:var(--card);border:1px solid var(--hairline);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;z-index:60}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;text-align:left;font-size:14px}
.menu button:hover,.menu button:focus-visible{background:var(--well)}
.menu hr{border:0;border-top:1px solid var(--hairline);margin:6px 4px}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(300px,360px) minmax(360px,1fr) minmax(360px,460px);gap:16px;padding:16px;height:calc(100vh - var(--top-h));height:calc(100dvh - var(--top-h))}
.panel{min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;padding-bottom:24px;border-radius:var(--r-card)}
.panel>.card{flex:none}
.card{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.card-h h2,.card-h h3{margin:0;font-size:14px;font-weight:700;letter-spacing:.01em}
.card-b{padding:12px 16px 16px}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.tabbar{display:none}
.legal{grid-column:1/-1;font-size:11.5px;color:var(--ink-3);text-align:center;padding:4px 16px 10px}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:var(--r-ctl);font-weight:600;font-size:14px;background:var(--well);color:var(--ink);transition:transform .12s,background .15s;white-space:nowrap}
.btn:hover{background:var(--hairline)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--press);color:var(--press-ink)}
.btn.primary:hover{opacity:.92}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--well);color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.sm{height:32px;padding:0 10px;font-size:13px;border-radius:10px}
.btn.lg{height:48px;padding:0 20px;font-size:15.5px;border-radius:14px}
.btn.block{width:100%}
.input{height:40px;width:100%;padding:0 12px;border-radius:var(--r-ctl);border:1px solid var(--hairline-2);background:var(--card);transition:border-color .15s}
.input:focus{border-color:var(--focus);outline:none}
.input.sm{height:32px;font-size:13px}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 17px) 17px,calc(100% - 12px) 17px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.seg{display:flex;padding:3px;gap:2px;background:var(--well);border-radius:12px;width:100%}
.seg button{flex:1;min-width:0;height:32px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,color .15s}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.switch{position:relative;width:44px;height:26px;border-radius:13px;background:var(--hairline-2);transition:background .18s;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.switch[aria-checked="true"]{background:var(--press)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
:root[data-theme="dark"] .switch[aria-checked="true"]::after{background:#111113}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .switch[aria-checked="true"]::after{background:#111113}}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--ink) var(--p,50%),var(--hairline-2) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--hairline-2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.08);box-shadow:0 1px 4px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.08);box-shadow:0 1px 4px rgba(0,0,0,.3)}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--focus);outline-offset:2px}
.swatch{width:34px;height:34px;border-radius:10px;border:1px solid rgba(0,0,0,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);flex:none;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%),linear-gradient(45deg,#ddd 25%,#fff 25%,#fff 75%,#ddd 75%);background-size:10px 10px;background-position:0 0,5px 5px;position:relative;overflow:hidden}
.swatch>i{position:absolute;inset:0;background:var(--c)}
.chip-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:var(--r-pill);background:var(--well);font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip-btn[aria-pressed="true"]{background:var(--press);color:var(--press-ink)}

/* ---------- search & catalog ---------- */
.search{position:relative;padding:14px 14px 0}
.search .lc{position:absolute;left:28px;top:50%;transform:translateY(calc(-50% + 7px));color:var(--ink-3);pointer-events:none}
.search input{height:46px;border-radius:14px;padding-left:42px;padding-right:40px;font-size:16px;background:var(--well);border-color:transparent}
.search input:focus{background:var(--card)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .clear{position:absolute;right:22px;top:50%;transform:translateY(calc(-50% + 7px))}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.cat-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px 0;font-size:13px}
.toggle-line{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px}
.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;padding:12px 10px 14px}
.app{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:14px;text-align:center;transition:background .15s}
.app:hover{background:var(--well)}
.app .thumb{width:46px;height:46px;border-radius:13px;background:var(--well);display:grid;place-items:center;color:var(--ink);transition:transform .2s cubic-bezier(.3,1.6,.6,1),background .15s,box-shadow .15s}
.app .thumb svg,.app .thumb img{width:24px;height:24px}
.app .thumb .tx{font-weight:700;font-size:17px;line-height:1}
.app .nm{font-size:11.5px;line-height:1.25;color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.app[aria-pressed="true"] .thumb{background:var(--press);color:var(--press-ink);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.app[aria-pressed="true"] .nm{color:var(--ink);font-weight:600}
.app.pop .thumb{animation:pop .32s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{0%{transform:scale(.82)}100%{transform:scale(1)}}
.si-img{filter:none}
.app[aria-pressed="true"] .si-img{filter:invert(1)}
:root[data-theme="dark"] .si-img{filter:invert(1)}
:root[data-theme="dark"] .app[aria-pressed="true"] .si-img{filter:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .si-img{filter:invert(1)}:root:not([data-theme="light"]) .app[aria-pressed="true"] .si-img{filter:none}}
.catalog-empty{grid-column:1/-1;padding:24px 10px;text-align:center;color:var(--ink-3);font-size:13.5px}
.more-sentinel{grid-column:1/-1;height:1px}

/* ---------- tray ---------- */
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px;padding:12px 12px 14px;min-height:60px}
.tile{position:relative;border-radius:14px;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tile-btn{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;padding:6px 2px;border-radius:14px}
.tile:hover{background:var(--well)}
.tile canvas{width:52px;height:52px}
.tile .nm{font-size:11px;color:var(--ink-2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .x{position:absolute;top:0;right:4px;width:22px;height:22px;border-radius:50%;background:var(--card);border:1px solid var(--hairline-2);display:grid;place-items:center;opacity:0;transition:opacity .15s;color:var(--ink-2)}
.tile:hover .x,.tile:focus-within .x{opacity:1}
@media (hover:none){.tile .x{opacity:1}}
.tile .x .lc{width:12px;height:12px}
.tile.dragging{opacity:.25}
.tile.enter{animation:tilein .28s ease-out}
@keyframes tilein{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.drag-ghost{position:fixed;left:0;top:0;z-index:90;pointer-events:none;transform-origin:center;filter:drop-shadow(0 10px 18px rgba(0,0,0,.3))}
.badge-warn{position:absolute;left:6px;top:2px;width:18px;height:18px;border-radius:50%;background:var(--warn);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--card)}
.drop-mark{outline:2px dashed var(--focus);outline-offset:2px}

/* ---------- editor ---------- */
.strip-wrap{position:sticky;top:0;z-index:5;background:var(--desk);padding-bottom:2px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;padding:6px 2px;border-radius:14px;border:1px solid transparent;font-size:10.5px;color:var(--ink-2)}
.strip button canvas{width:40px;height:40px}
.strip button .all{width:40px;height:40px;border-radius:12px;background:var(--well);display:grid;place-items:center}
.strip button span{max-width:58px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip button[aria-pressed="true"]{background:var(--card);border-color:var(--hairline-2);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.stage{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:18px;min-height:150px;background:repeating-conic-gradient(var(--well) 0 25%,var(--card) 0 50%) 0 0/16px 16px;border-radius:var(--r-card);border:1px solid var(--hairline)}
.stage canvas{touch-action:none}
.stage .one{display:flex;flex-direction:column;align-items:center;gap:8px}
.stage .one canvas{width:150px;height:150px}
.stage .multi{display:grid;grid-template-columns:repeat(4,64px);gap:14px}
.stage .multi canvas{width:64px;height:64px}
.stage-meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.warn-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:600}
.sec{border-top:1px solid var(--hairline)}
.sec:first-child{border-top:0}
.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;font-weight:700;font-size:14px;user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .chev{margin-left:auto;transition:transform .2s;color:var(--ink-3)}
.sec[open]>summary .chev{transform:rotate(180deg)}
.sec>summary .sec-on{margin-left:auto}
.sec>summary .sec-on+.chev{margin-left:8px}
.sec-b{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.ctl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 8px}
.ctl>label,.ctl>.lbl{font-size:13px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px;min-width:0}
.ctl .val{font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:500;margin-left:auto;font-size:12.5px}
.ctl .body{grid-column:1/-1;display:flex;align-items:center;gap:8px;min-width:0}
.ctl .reset{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.ctl .reset:hover{background:var(--well);color:var(--ink)}
.ctl .reset:disabled{visibility:hidden}
.ovr{width:7px;height:7px;border-radius:50%;background:var(--focus);flex:none}
.color-row{display:flex;align-items:center;gap:8px;width:100%}
.color-row .hex{font-family:var(--mono);font-size:13px;width:96px;text-transform:uppercase}
.stops{display:flex;flex-direction:column;gap:8px;width:100%}
.stop{display:flex;align-items:center;gap:8px}
.grad-bar{height:14px;border-radius:7px;border:1px solid var(--hairline-2);width:100%}
.alt-list{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.alt-list .swatch{width:40px;height:40px}
.upload{display:flex;align-items:center;gap:10px;width:100%}
.upload .pv{width:56px;height:56px;border-radius:12px;background:var(--well) center/cover no-repeat;flex:none;border:1px solid var(--hairline)}
.ed-actions{display:flex;flex-wrap:wrap;gap:8px}
.glyph-now{display:flex;align-items:center;gap:12px;width:100%}
.glyph-now .g{width:52px;height:52px;border-radius:14px;background:var(--well);display:grid;place-items:center}
.glyph-now .g svg,.glyph-now .g img{width:28px;height:28px}

.modal{position:fixed;z-index:80;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,calc(100vw - 32px));max-height:min(86vh,820px);display:flex;flex-direction:column;background:var(--card);border-radius:22px;box-shadow:var(--shadow-lg);border:1px solid var(--hairline);animation:popin .18s ease-out;overflow:hidden}

.sv{position:relative;height:170px;border-radius:12px;touch-action:none;cursor:crosshair;background:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,hsl(var(--h),100%,50%))}

.cp-row{display:flex;align-items:center;gap:8px;margin-top:12px}

.lib-tabs{display:flex;gap:6px;padding:0 20px 0;overflow-x:auto}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.lib-grid button{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;background:var(--card-2);border:1px solid var(--hairline);color:var(--ink)}

/* ---------- preview ---------- */
.right-tabs{position:sticky;top:0;z-index:5;background:var(--desk);padding-bottom:2px}

.mock{position:absolute;left:0;top:0;transform-origin:0 0}
.device{position:absolute;background:#0b0b0c;box-shadow:0 0 0 2px #2a2a2e,0 30px 60px rgba(0,0,0,.28)}
.screen{position:absolute;overflow:hidden;background:#F2F2F7;isolation:isolate}
.wall{position:absolute;inset:0;background-size:cover;background-position:center}

.m-label{position:absolute;left:-14px;right:-14px;text-align:center;font-size:12px;line-height:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;letter-spacing:-.01em}
.m-label.light{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.m-label.dark{color:#1c1c1e}
.m-dock{position:absolute;backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6)}
.m-widget{position:absolute;border-radius:22px;overflow:hidden;background:rgba(255,255,255,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:grid;place-items:center;color:rgba(0,0,0,.55);cursor:grab;touch-action:none}
.m-widget canvas{position:absolute;inset:0;width:100%;height:100%}

.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;max-height:220px;overflow:auto;padding:2px}

/* ---------- guide ---------- */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--card-2);border:1px solid var(--hairline)}

.step b{display:block;font-size:13.5px;margin-bottom:2px}
.step p{margin:0;font-size:13px;color:var(--ink-2)}
.tipbox{padding:12px 14px;border-radius:14px;background:var(--well);font-size:13px;color:var(--ink-2)}
.tipbox b{color:var(--ink)}
.guide h3{font-size:14px;margin:18px 0 8px}

/* ---------- responsive: phones & tablets ---------- */
@media (max-width:1099px){
  :root{--top-h:98px}

  .platforms{order:3;width:100%;margin:0}
  .platforms button{flex:1;padding:0 6px;font-size:13px;height:32px;justify-content:center}
  .layout{display:block;height:auto;padding:12px 12px calc(var(--tab-h) + 24px + env(safe-area-inset-bottom))}
  .panel{display:none;overflow:visible;padding-bottom:0}
  body[data-tab="apps"] #pApps,body[data-tab="style"] #pStyle,body[data-tab="preview"] #pRight,body[data-tab="download"] #pRight{display:flex}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--hairline)}

  .tabbar .count{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--press);color:var(--press-ink);font-size:10.5px;display:grid;place-items:center}
  .strip-wrap{top:var(--top-h);margin:0 -12px;padding:0 12px 2px}
  .stage{position:sticky;top:calc(var(--top-h) + 76px);z-index:4;min-height:0;padding:12px}
  .stage .one canvas{width:110px;height:110px}
  .stage .multi{grid-template-columns:repeat(4,52px);gap:10px}
  .stage .multi canvas{width:52px;height:52px}
  .right-tabs{top:var(--top-h);margin:0 -12px;padding:0 12px 6px}
  .legal{padding-bottom:calc(var(--tab-h) + 16px)}
  .modal{top:auto;bottom:0;left:0;right:0;transform:none;width:100%;max-height:92vh;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom);animation:sheetin .22s ease-out}
  .modal.narrow{width:100%}
  @keyframes sheetin{from{transform:translateY(40px);opacity:0}}
  .pop.sheet{left:0!important;right:0;top:auto!important;bottom:0;width:100%;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:sheetin .22s ease-out}
  .toast{bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom))}
  .menu{right:8px}
  html{scroll-padding-bottom:calc(var(--tab-h) + 24px);scroll-padding-top:calc(var(--top-h) + 12px)}
}
@media (max-width:420px){

@media (prefers-reduced-motion: reduce){

  return `<svg class="ill" viewBox="0 0 64 76" aria-hidden="true"><rect x="9" y="2" width="44" height="72" rx="10" fill="var(--card)" stroke="var(--hairline-2)" stroke-width="2"/><rect x="24" y="6.5" width="14" height="4" rx="2" fill="var(--hairline-2)"/><rect x="15" y="20" width="32" height="32" rx="9" fill="var(--well)"/><g transform="translate(20 25) scale(.92)" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${nodes.map(([tg, a]) => `<${tg} ${nodeAttrs(a)}/>`).join('')}</g><circle cx="50" cy="64" r="10" fill="var(--press)"/><text x="50" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="var(--press-ink)" font-family="system-ui,sans-serif">${n}</text></svg>`;
}

function readmeText(plats) {
  const L = S.lang, out = [];
  out.push('ICON STUDIO', '='.repeat(11), '', t('readmeIntro'), '');
  for (const p of plats) {
    const g = GUIDES[L][p];
    out.push(PLATFORMS[p].label.toUpperCase() + `  (${p}/)`, '-'.repeat(30), g.intro, '');
    for (const part of g.parts) {
      if (part.h) out.push(part.h);
      if (part.steps) part.steps.forEach(([, a, b], i) => out.push(`  ${i + 1}. ${a} — ${b}`));
      if (part.tip) out.push(`  ${t('tip')}: ${part.tip}`);
      out.push('');
    }
  }
  out.push(t('legal'));
  return out.join('\r\n');
}

function t(key, vars) {
  let s = (I18N[S.lang] && I18N[S.lang][key]) ?? I18N.cs[key] ?? key;
  if (vars) s = String(s).replace(/\{(\w+)\}/g, (m, k) => vars[k] ?? m);
  return s;
}
function applyI18n() {
  document.documentElement.lang = S.lang;
  $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  $$('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  $('#q').placeholder = t('searchPh');
  $('#qClear').setAttribute('aria-label', t('clearSearch'));
  $('#qClear').innerHTML = ico('x');
  $('#btnCustom').innerHTML = ico('plus', 'sm') + esc(t('addCustom'));
  $('#btnResetSet').textContent = t('resetSet');
  $('#btnClear').textContent = t('clearSel');
  $('#catalog').setAttribute('aria-label', t('catalog'));
  $('#tray').setAttribute('aria-label', t('selectedList'));
}
const THEME_MODES = ['auto', 'light', 'dark'];

  const b = $('#btnTheme');

function renderHeader() {

}
function setPlatform(p) {
  if (S.platform === p) return;
  const prev = S.platform;
  S.platform = p; UI.guidePlat = null;
  if (S.export.platforms.length === 1 && S.export.platforms[0] === prev) S.export.platforms = [p];
  S.preview.page = 0;
  Thumbs.invalidateAll();
  renderHeader(); CatalogUI.render(); Tray.render(); Strip.render(); Stage.render(); Editor.render(); Preview.render();
  ExportUI.renderIfVisible(); if (!$('#vGuide').hidden) GuideUI.render();
  saveSoon();
}

/* ---- project menu ---- */
function openMenu() {
  const m = $('#menu'), btn = $('#btnMenu');
  if (!m.hidden) return closeMenu();
  m.innerHTML = '';
  const item = (icon, label, fn) => h('button', { type: 'button', role: 'menuitem', html: ico(icon) + esc(label), onclick: () => { closeMenu(); fn(); } });
  m.append(
    item('file-plus', t('newProject'), newProject),
    item('file-down', t('exportProject'), exportProject),
    item('file-up', t('importProject'), importProject),
    h('hr'),
    item('list-restart', t('resetSet'), resetDefaultSet),
    item('book-open', t('tabGuide'), () => { setRight('guide'); if (isMobileLayout()) { UI.tab = 'download'; document.body.dataset.tab = 'download'; renderTabbar(); } }),
    h('hr'),
    h('p.small.muted', { style: { margin: '6px 12px 8px', maxWidth: '240px' }, text: t('privacy') }));
  m.hidden = false; btn.setAttribute('aria-expanded', 'true');
  m.querySelector('button').focus();
  setTimeout(() => document.addEventListener('pointerdown', menuOutside, true), 0);
}
function closeMenu() { $('#menu').hidden = true; $('#btnMenu').setAttribute('aria-expanded', 'false'); document.removeEventListener('pointerdown', menuOutside, true); }
function menuOutside(e) { if (!$('#menu').contains(e.target) && !$('#btnMenu').contains(e.target)) closeMenu(); }
function applyDefaultSet() {
  for (const c of DEFAULT_CUSTOM_APPS) if (!S.customApps.some(x => x.id === c.id)) S.customApps.push(Object.assign({}, c));
  buildApps();
  S.icons = DEFAULT_SET.filter(id => APPS.has(id)).map(makeIcon);
  S.dock = DEFAULT_DOCK.map(id => (S.icons.find(i => i.app === id) || {}).uid).filter(Boolean);
  S.widgets = [];
}
async function resetDefaultSet() {
  if (!(await confirmDialog(t('resetSetQ'), t('reset')))) return;
  applyDefaultSet(); UI.target = 'all'; Thumbs.masters.clear(); CatalogUI.buildIndex(); CatalogUI.render(); onIconsChanged();
}
async function newProject() {
  if (!(await confirmDialog(t('newProjectQ'), t('newProject'), true))) return;
  const lang = S.lang, plat = S.platform;
  S = freshState(); S.lang = lang; S.platform = plat;
  applyDefaultSet(); UI.target = 'all';
  Thumbs.masters.clear(); Thumbs.invalidateAll(); CatalogUI.buildIndex(); renderAll(); saveSoon();
  toast(t('projectNew'));
}
function exportProject() {
  const data = Object.assign({ app: 'Icon Studio', kind: 'project' }, S, { images: Object.fromEntries([...Persist.usedImages()].filter(k => S.images[k]).map(k => [k, S.images[k]])) });
  downloadBlob(new Blob([JSON.stringify(data)], { type: 'application/json' }), 'icon-studio-project.json');
}
async function importProject() {
  const f = await pickFile('json'); if (!f) return;
  try {
    const d = JSON.parse(await readFileAsText(f));
    if (!d || d.v !== 1 || !Array.isArray(d.icons)) throw 0;
    S = Persist.migrate(d);
    buildApps(); CatalogUI.buildIndex();
    S.icons = S.icons.filter(i => APPS.has(i.app));
    Images.els.clear(); Thumbs.masters.clear(); UI.target = 'all';
    await Images.ensure(Object.keys(S.images));
    Thumbs.invalidateAll(); renderAll(); saveSoon();
    toast(t('projectImported'));
  } catch { toast(t('badJson')); }
}

/* ---- keyboard navigation inside the catalog grid ---- */
function catalogKeys(e) {
  const b = e.target.closest('.app'); if (!b) return;
  const all = $$('#catalog .app'), i = all.indexOf(b);
  const cols = all.filter(x => x.offsetTop === all[0].offsetTop).length || 1;
  const d = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols, Home: -i, End: all.length - 1 - i }[e.key];
  if (d == null) return;
  e.preventDefault();
  const n = all[clamp(i + d, 0, all.length - 1)]; n && n.focus();
}

/* ---- boot ---- */
function boot() {
  const ui = store.get(LS.ui, {});
  UI.allPlats = !!ui.allPlats;
  const had = Persist.load();
  if (!had) {
    S = freshState();
    if (!/^cs|^sk/i.test(navigator.language || 'cs')) S.lang = 'en';
    applyDefaultSet();
  }
  buildApps();
  S.icons = S.icons.filter(i => APPS.has(i.app));
  CatalogUI.buildIndex();
  Images.ensure(Object.keys(S.images));
  if (!window.lucide) console.warn('Lucide failed to load — falling back to letters.');
  renderAll();
  Thumbs.invalidateAll();
  Thumbs.listeners.add(() => Tray.badges());
  Sorter.attach($('#tray'));
  // listeners
  const q = $('#q');
  q.addEventListener('input', debounce(() => { UI.q = q.value; $('#qClear').hidden = !q.value; CatalogUI.render(); }, 120));
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { const first = $('#catalog .app'); first && first.click(); } if (e.key === 'Escape') { q.value = ''; UI.q = ''; $('#qClear').hidden = true; CatalogUI.render(); } });
  $('#qClear').onclick = () => { q.value = ''; UI.q = ''; $('#qClear').hidden = true; CatalogUI.render(); q.focus(); };
  $('#catalog').addEventListener('keydown', catalogKeys);
  $('#allPlatforms').onclick = () => { UI.allPlats = !UI.allPlats; $('#allPlatforms').setAttribute('aria-checked', String(UI.allPlats)); store.set(LS.ui, Object.assign(store.get(LS.ui, {}), { allPlats: UI.allPlats })); CatalogUI.render(); };
  $('#btnSelectCat').onclick = () => {
    const apps = CatalogUI.list.filter(a => !S.icons.some(i => i.app === a.id));
    if (!apps.length) { toast(t('allAlready')); return; }
    apps.forEach(a => S.icons.push(makeIcon(a.id)));
    toast(t('addedN', { n: apps.length })); onIconsChanged();
  };
  $('#btnCustom').onclick = () => Pickers.customApp();
  $('#btnResetSet').onclick = resetDefaultSet;
  $('#btnClear').onclick = async () => { if (!S.icons.length) return; if (await confirmDialog(t('clearSelQ'), t('clearSel'), true)) { S.icons = []; S.dock = []; UI.target = 'all'; onIconsChanged(); } };
  $('#btnLang').onclick = () => { S.lang = S.lang === 'cs' ? 'en' : 'cs'; renderAll(); saveSoon(); };
  $('#btnTheme').onclick = () => { const cur = store.get(LS.ui, {}).theme || 'auto'; const nx = THEME_MODES[(THEME_MODES.indexOf(cur) + 1) % 3]; store.set(LS.ui, Object.assign(store.get(LS.ui, {}), { theme: nx })); applyUITheme(); toast(t('uiTheme') + ': ' + t('th_' + nx), 1400); };
  $('#btnMenu').onclick = openMenu;
  $('#menu').addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); $('#btnMenu').focus(); } });
  let wasMobile = isMobileLayout();
  window.addEventListener('resize', debounce(() => {
    const m = isMobileLayout();
    if (m !== wasMobile) { wasMobile = m; Stage.render(); Strip.render(); Tray.render(); }
    if (!$('#vPreview').hidden) Preview.render();
  }, 160));
  window.addEventListener('pagehide', () => Persist.save());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Persist.save(); });
  if (!had) saveSoon();
  if (/[?&]debug\b/.test(location.search)) window.IconStudio = { get S() { return S; }, set S(v) { S = v; }, Exporter, renderIcon, iconSVG, mockupPNG, Thumbs, Glyphs, Images, Preview, Editor, selectTarget, setPlatform, setTab, setRight, onIconsChanged, renderAll, Persist };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
