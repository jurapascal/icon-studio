name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Nahrát znovu všechny soubory"
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Upload over FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEPLOY_FULL: ${{ inputs.full && '1' || '0' }}
          DEPLOY_SUMMARY: ${{ runner.temp }}/deploy-summary.json
        run: python3 .github/deploy.py

      - name: Discord
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATUS: ${{ job.status }}
          SUMMARY: ${{ runner.temp }}/deploy-summary.json
          SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || exit 0
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          ok = os.environ["STATUS"] == "success"
          s = {}
          try:
              s = json.load(open(os.environ["SUMMARY"]))
          except Exception:
              pass
          msg = (os.environ.get("COMMIT_MSG") or "manual run").splitlines()[0][:200]
          lines = [f"`{os.environ['SHA'][:7]}` {msg} — {os.environ['ACTOR']}"]
          if s:
              lines.append(f"Uploaded {s.get('uploaded', 0)}, deleted {s.get('deleted', 0)}")
          body = {
              "username": "Deploy",
              "embeds": [{
                  "title": ("✅ " if ok else "❌ ") + os.environ["REPO"].split("/")[1],
                  "description": "\n".join(lines),
                  "color": 0x2ECC71 if ok else 0xE74C3C,
              }],
          }
          req = urllib.request.Request(os.environ["DISCORD_WEBHOOK"], json.dumps(body).encode(),
                                       {"Content-Type": "application/json", "User-Agent": "deploy"})
          for attempt in range(5):
              try:
                  urllib.request.urlopen(req, timeout=20)
                  break
              except urllib.error.HTTPError as e:
                  if e.code != 429:
                      raise
                  # Discord rate limit, shared with the GitHub webhook on the same channel
                  time.sleep(float(e.headers.get("Retry-After") or 2) + 1)
          PY
